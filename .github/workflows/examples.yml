name: examples

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: read

jobs:
  examples:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dvipng texlive-latex-extra texlive-fonts-recommended cm-super

      - name: Install
        run: uv pip install . --group examples --system

      # The notebooks are independent (only 07 writes to disk), so execute them in
      # parallel instead of serially.
      - name: Run tests
        run: pytest -vv -n auto --nbmake examples/*.ipynb
