name: docs

on:
  push:
    branches:
      - develop

permissions:
  contents: write  # pushes the rendered docs to the documentation branch

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/checkout@v7
      - name: uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Updated documentation
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          git fetch origin documentation
          git checkout documentation
          git pull
          git merge --allow-unrelated-histories -X theirs develop
          uv pip install . --group docs --system
          echo $(ls -l docs)
          pdoc --docformat numpy --math -o ./docs ./pyerrors
          echo $(ls -l docs)
          git add docs
          if [ -n "$(git diff --cached --exit-code)" ]; then git commit -am "Documentation updated"; git push; fi
