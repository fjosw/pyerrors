name: ruff
on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install lint tooling
        run: uv pip install --group lint --system
      - name: Run Ruff
        run: ruff check pyerrors
